name: Treinar projeto e gerar screenshots

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  treinar-e-capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Instalar Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validar sintaxe
        run: python -m compileall -q app.py train.py

      - name: Treinar modelos e gerar relatórios
        run: python train.py

      - name: Copiar gráficos para screenshots
        run: |
          mkdir -p screenshots
          cp reports/graficos/*.png screenshots/

      - name: Abrir app e capturar screenshots
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/ >/dev/null
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          Path("screenshots").mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(
                  viewport={"width": 1440, "height": 1000}
              )
              page.goto(
                  "http://127.0.0.1:8501/",
                  wait_until="networkidle",
                  timeout=120000
              )
              page.get_by_text(
                  "Previsão de Preços de Imóveis"
              ).wait_for(timeout=60000)
              page.screenshot(
                  path="screenshots/app_tela_inicial.png",
                  full_page=True
              )
              page.get_by_role(
                  "button", name="Fazer previsão"
              ).click()
              page.get_by_text(
                  "Valor mediano estimado"
              ).wait_for(timeout=60000)
              page.screenshot(
                  path="screenshots/app_previsao.png",
                  full_page=True
              )
              browser.close()
          PY

      - name: Salvar resultados e screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models reports screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Gerar resultados e screenshots [skip ci]"
            git push
          else
            echo "Sem alterações nos artefatos."
          fi
